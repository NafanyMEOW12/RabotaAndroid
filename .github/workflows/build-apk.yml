
name: Build Rabota Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'RabotaAndroid_project.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Extract source archive
        run: |
          unzip -o RabotaAndroid_project.zip -d .
          test -f app/src/main/java/ru/rabota/app/MainActivity.java
          test -f app/build.gradle

      - name: Fix mutable spinner adapter
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("app/src/main/java/ru/rabota/app/MainActivity.java")
          s = p.read_text(encoding="utf-8")

          old = "this,android.R.layout.simple_spinner_item,vals"
          new = "this,android.R.layout.simple_spinner_item,new ArrayList<>(Arrays.asList(vals))"

          if old in s:
              s = s.replace(old, new)
              p.write_text(s, encoding="utf-8")
              print("Spinner adapter fix applied.")
          elif new in s:
              print("Spinner adapter fix already present.")
          else:
              raise SystemExit("Could not locate spinner adapter line; build stopped.")

          if "new ArrayList<>(Arrays.asList(vals))" not in s:
              raise SystemExit("Spinner fix verification failed.")
          PY

      - name: Build debug APK
        run: gradle --no-daemon clean assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Rabota-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

